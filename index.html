<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebCam + Cisne Interactivo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    #cursor-cisne {
      position: absolute;
      width: 200px;
      height: 200px;
      pointer-events: auto;
      left: 0;
      top: 0;
      transition: left 0.1s ease, top 0.1s ease;
      cursor: pointer;
      user-select: none;
      z-index: 1;
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    .wing {
      transform-origin: 130px 160px;
      animation: flap 1.5s ease-in-out infinite;
    }

    .wing.right {
      transform-origin: 210px 130px;
      animation: flap 1.5s ease-in-out infinite;
      animation-direction: alternate;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline></video>

  <!-- Cisne que sigue el cursor y cambia color al hacer clic con alas animadas -->
  <svg id="cursor-cisne" class="change-color" viewBox="0 0 280 300">
    <polygon class="color-part" points="50,150 45,111 65,123" fill="#FA8015"/>
    <polygon class="color-part" points="240,77 220,140 115,160" fill="#F7EA00"/>
    <polygon class="color-part" points="55,89 49,111 115,160 135,127" fill="#FF0000"/>
    <polygon class="color-part" points="50,150 49,111 65,123" fill="#F7AB00"/>
    <polygon class="color-part wing" points="230,154 199,190 130,180 111,160 130,125" fill="#BA00BF"/>
    <polygon class="color-part" points="180,110 210,140 115,160 111,140 117,125" fill="#00C7EB"/>
    <polygon class="color-part wing right" points="175,109 209,140 229,110" fill="#04CA00"/>
    <polygon class="color-part" points="175,109 225,155 225,120" fill="#04ED00"/>
    <polygon class="color-part" points="270,175 220,135 115,160" fill="#E6FF00"/>
  </svg>

  <script>
    const video = document.getElementById('video');
    const constraints = {
      video: { width: 1280, height: 720 },
      audio: false
    };

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        alert("Debes permitir el acceso a la cámara.");
        console.error(err);
      }
    }

    initCamera();

    // Cisne que sigue el cursor
    const cursorCisne = document.getElementById('cursor-cisne');
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX - cursorCisne.clientWidth / 2;
      const y = e.clientY - cursorCisne.clientHeight / 2;
      cursorCisne.style.left = `${x}px`;
      cursorCisne.style.top = `${y}px`;
    });

    // Cambiar color al hacer clic
    cursorCisne.addEventListener('click', () => {
      cursorCisne.querySelectorAll('.color-part').forEach(polygon => {
        polygon.setAttribute('fill', '#' + Math.floor(Math.random() * 16777215).toString(16));
      });
    });
  </script>
</body>
</html>
